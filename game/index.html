<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahía Sol</title>
<style>
  :root {
    --amber: #ffc46b;
    --amber-dim: rgba(255, 196, 107, 0.55);
    --ink: #0c1016;
    --panel: rgba(8, 12, 18, 0.55);
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #080b11;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #f4efe6; user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------------------------------------------------------------- HUD */
  #hud { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
  #hud.on { opacity: 1; }

  .hud-tl { position: absolute; top: 26px; left: 30px; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #district {
    font-size: 21px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: #fff3dd;
  }
  #street { font-size: 12px; letter-spacing: .16em; color: var(--amber); opacity: .9; margin-top: 2px; }
  #objective {
    margin-top: 18px; display: flex; gap: 9px; align-items: flex-start; max-width: 430px;
    font-size: 13.5px; line-height: 1.45; letter-spacing: .03em; color: #f4eee2;
    background: linear-gradient(90deg, rgba(8,12,18,.72), rgba(8,12,18,0));
    border-left: 2px solid var(--amber); padding: 7px 14px 7px 10px;
  }
  #objective .tag {
    font-size: 10px; letter-spacing: .2em; color: var(--amber); font-weight: 700;
    margin-right: 4px; white-space: nowrap;
  }
  #objective .txt { text-transform: none; }

  .hud-tr { position: absolute; top: 24px; right: 32px; text-align: right; }
  #cash {
    font-size: 30px; font-weight: 700; letter-spacing: .04em; color: #eaf7e7;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  #cash .small { font-size: 14px; color: var(--amber); letter-spacing: .18em; }
  #stars { margin-top: 8px; font-size: 22px; letter-spacing: 3px; color: rgba(255,255,255,.18); }
  #stars b { color: #ffd15c; text-shadow: 0 0 12px rgba(255, 190, 70, .8); font-weight: 400; }
  #stars i { color: rgba(255,255,255,.16); font-style: normal; }

  .hud-bl { position: absolute; left: 30px; bottom: 28px; }
  #minimap-wrap {
    position: relative; width: 208px; height: 208px; border-radius: 50%;
    box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.16) inset;
    overflow: hidden; background: #0d1319;
  }
  #minimap { width: 208px; height: 208px; display: block; }
  #map-n {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .2em; color: rgba(255,255,255,.6);
  }
  .bars { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; width: 208px; }
  .bar { height: 9px; background: rgba(6,9,13,.66); border: 1px solid rgba(255,255,255,.16); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 100%; display: block; transition: width .2s ease; }
  #health-fill { background: linear-gradient(90deg, #6fd18a, #b8e986); }
  #armour-fill { background: linear-gradient(90deg, #4aa6d8, #8fd8f2); }
  .bar.health { height: 12px; }
  #weapon {
    margin-top: 10px; font-size: 12px; letter-spacing: .18em; color: #e9e2d4;
    text-transform: uppercase;
  }
  #weapon b { color: var(--amber); font-weight: 600; }

  .hud-br { position: absolute; right: 32px; bottom: 26px; width: 150px; height: 150px; }
  #speedo { width: 150px; height: 150px; display: block; }

  #ticker {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    max-width: 560px; padding: 7px 18px; font-size: 13px; letter-spacing: .04em;
    background: rgba(6,10,15,.72); border-left: 2px solid var(--amber);
    color: #f6efe2; opacity: 0; transition: opacity .3s ease; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #ticker.on { opacity: 1; }
  #ticker b { color: var(--amber); font-weight: 600; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
    transform: translate(-50%, -50%); opacity: .75;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(255,255,255,.85);
    box-shadow: 0 0 3px rgba(0,0,0,.8);
  }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #crosshair.hide { display: none; }

  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 100%);
  }
  #damage {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(120,0,0,0) 40%, rgba(150,10,10,.55) 100%);
    transition: opacity .25s ease;
  }

  /* ---------------------------------------------------------- overlays */
  #mission-card {
    position: absolute; left: 46px; bottom: 270px; width: 430px;
    background: linear-gradient(100deg, rgba(10,14,20,.94), rgba(10,14,20,.7));
    border-left: 3px solid var(--amber); padding: 16px 20px 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
    transform: translateY(14px); opacity: 0; transition: all .35s ease;
  }
  #mission-card.on { opacity: 1; transform: translateY(0); }
  #mission-card .who { font-size: 11px; letter-spacing: .26em; color: var(--amber); text-transform: uppercase; }
  #mission-card .job { font-size: 19px; font-weight: 700; letter-spacing: .06em; margin-top: 4px; }
  #mission-card .line { font-size: 13.5px; line-height: 1.5; color: #ded8cc; margin-top: 8px; font-style: italic; }

  #big-message {
    position: absolute; left: 0; right: 0; top: 38%; text-align: center;
    font-size: 54px; font-weight: 800; letter-spacing: .12em; color: #fff;
    text-shadow: 0 0 30px rgba(255,170,80,.45), 0 6px 30px rgba(0,0,0,.7);
  }
  #big-message small { display: block; font-size: 14px; letter-spacing: .32em; color: var(--amber); margin-top: 10px; font-weight: 600; }

  #start-screen, #pause-screen {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  #start-screen {
    background:
      radial-gradient(ellipse at 26% 32%, rgba(255, 168, 88, .22), rgba(5,8,13,0) 55%),
      linear-gradient(180deg, rgba(6,10,16,.72), rgba(6,10,16,.9));
  }
  .title-block { max-width: 880px; padding: 40px 54px; }
  .eyebrow { font-size: 11px; letter-spacing: .44em; color: var(--amber); text-transform: uppercase; }
  h1 {
    margin: 10px 0 4px; font-size: 86px; line-height: .94; font-weight: 800; letter-spacing: .04em;
    text-transform: uppercase; color: #fff6e6;
    text-shadow: 0 0 40px rgba(255,150,70,.28), 0 10px 40px rgba(0,0,0,.6);
  }
  h1 span { display: block; font-size: 26px; letter-spacing: .5em; color: var(--amber); margin-top: 12px; font-weight: 600; }
  .lede { margin: 22px 0 0; max-width: 560px; font-size: 14px; line-height: 1.65; color: #cfc9bd; }
  .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 30px; margin-top: 26px; max-width: 620px; }
  .controls div { display: flex; gap: 10px; font-size: 12.5px; color: #cfc9bd; letter-spacing: .03em; }
  .controls kbd {
    font-family: inherit; font-size: 11px; min-width: 62px; text-align: center;
    padding: 3px 7px; border: 1px solid rgba(255,255,255,.22); border-bottom-color: rgba(255,255,255,.1);
    background: rgba(255,255,255,.06); color: #fff; letter-spacing: .1em;
  }
  .menu-buttons { margin-top: 30px; display: flex; gap: 14px; }
  button.menu-btn {
    pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; padding: 13px 26px;
    color: #14100a; background: var(--amber); border: 0; min-width: 190px;
    transition: transform .15s ease, background .15s ease;
  }
  button.menu-btn:hover { transform: translateY(-2px); background: #ffd68e; }
  button.menu-btn.ghost { background: transparent; color: #f4efe6; box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
  button.menu-btn.ghost:hover { background: rgba(255,255,255,.08); }
  .menu-note { margin-top: 18px; font-size: 11px; letter-spacing: .18em; color: rgba(230,224,212,.5); text-transform: uppercase; }

  #pause-screen { background: rgba(5, 8, 13, .78); backdrop-filter: blur(3px); }
  #pause-screen .panel { width: 420px; padding: 30px 34px; background: rgba(12,17,24,.92); border: 1px solid rgba(255,255,255,.12); }
  #pause-screen h2 { margin: 0 0 4px; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; }
  #pause-screen .sub { font-size: 11px; letter-spacing: .26em; color: var(--amber); text-transform: uppercase; }
  #pause-screen .row { display: flex; justify-content: space-between; font-size: 13px; color: #d7d1c5; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  #pause-screen .row b { color: #fff; font-weight: 600; }
  #pause-screen .menu-buttons { flex-direction: column; }
  #pause-screen button.menu-btn { width: 100%; }
  .badge-row { display: flex; gap: 8px; margin-top: 26px; }
  .badge-row span { font-size: 10px; letter-spacing: .2em; color: var(--amber); border: 1px solid rgba(255,196,107,.4); padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Bahía Sol, an open world crime game"></canvas>
<div id="ui"></div>
<p id="status" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;"></p>

<script src="./vendor/three.min.js"></script>
<script src="./src/config.js"></script>
<script src="./src/rng.js"></script>
<script src="./src/textures.js"></script>
<script src="./src/city.js"></script>
<script src="./src/shadows.js"></script>
<script src="./src/input.js"></script>
<script src="./src/vehicles.js"></script>
<script src="./src/traffic.js"></script>
<script src="./src/pedestrians.js"></script>
<script src="./src/player.js"></script>
<script src="./src/combat.js"></script>
<script src="./src/police.js"></script>
<script src="./src/missions.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/saves.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
